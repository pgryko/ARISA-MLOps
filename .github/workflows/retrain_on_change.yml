name: Preproc data and train model

on: 
  push:
    branches:
      - main
    paths:  
      - 'data/raw/train.csv'
      - 'data/processed/train.csv'
      - 'ARISA_DSML/preproc.py'
      - 'ARISA_DSML/train.py'
      - 'ARISA_DSML/data_prep.py'
      - 'models/best_params.pkl'
  workflow_dispatch:
jobs:
  preprocess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with: 
          python-version: "3.11"
      - name: Install dependencies
        run: make requirements
      - name: Create kaggle directory
        env: 
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p $HOME/.config/kaggle
          echo "$KAGGLE_KEY" > $HOME/.config/kaggle/kaggle.json
          chmod 600 $HOME/.config/kaggle/kaggle.json
      - name: Run preprocessing
        run: make preprocess
      - name: Upload preprocessed data
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: data/processed

  train:
    runs-on: ubuntu-latest
    needs: preprocess
    permissions:
      contents: write
      actions: write
    steps: 
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download processed data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/processed
      - name: Set up Python
        uses: actions/setup-python@v4
        with: 
          python-version: "3.11"
      - name: Install dependencies
        run: make requirements
      - name: Setup MLflow
        run: |
          mkdir -p .mlflow/db
          mkdir -p .mlflow/artifacts
      - name: Run training
        run: make train
      - name: Commit MLflow artifacts
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .mlflow/artifacts
          git add .mlflow/db
          git commit -m "Update ML artifacts" || echo "No changes to commit"
          git push
      - name: Trigger Predict Workflow
        run: |
          curl -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/predict_on_model_change.yml/dispatches \
          -d '{"ref":"main"}'