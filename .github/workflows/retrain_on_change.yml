name: Preproc data and train model

on: 
  push:
    branches:
      - main
    paths:  
      - 'data/raw/train.csv'
      - 'data/processed/train.csv'
      - 'ARISA_DSML/**/*.py'
      - 'models/best_params.pkl'
      - '.github/workflows/retrain_on_change.yml'
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps: 
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Set up Python
        uses: actions/setup-python@v4
        with: 
          python-version: "3.11"

      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg \
          && sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg \
          && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
          && sudo apt update \
          && sudo apt install gh -y
          
      - name: Install dependencies
        run: make requirements
        
      - name: Setup MLflow
        run: |
          mkdir -p .mlflow/db
          mkdir -p .mlflow/artifacts
          
      - name: Run training
        run: make train
        
      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create a new branch
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Create new branch with timestamp
          BRANCH_NAME="model-update-$(date +%Y%m%d-%H%M%S)"
          git checkout -b $BRANCH_NAME
          
          # Add and commit changes
          git add .mlflow/artifacts/
          git add .mlflow/db/
          git add models/
          git add reports/figures/
          git add data/processed/
          
          git commit -m "Update ML artifacts [skip ci]" || echo "No changes to commit"
          
          # Push new branch
          git push origin $BRANCH_NAME
          
          # Create PR using GitHub CLI
          gh pr create \
            --title "Update ML artifacts [Automated]" \
            --body "Automated PR to update ML artifacts from training workflow" \
            --base main \
            --head $BRANCH_NAME \
            --label "automated-pr" \
            --label "model-update"
            
      - name: Auto-merge Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the PR number from the previous step
          PR_NUMBER=$(gh pr list --head $BRANCH_NAME --json number -q '.[0].number')
          
          # Enable auto-merge
          gh pr merge $PR_NUMBER --auto --merge
        
      - name: Trigger Predict Workflow
        if: success()
        run: |
          curl -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/predict_on_model_change.yml/dispatches \
          -d '{"ref":"main"}'